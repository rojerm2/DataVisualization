<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sleep Health Analysis</title>

    <link th:href="@{/css/sleep-data-table.css}" rel="stylesheet">
    <script th:src="@{/js/sleep-data-table.js}"></script>
</head>
<body>

<!-- Navigation Header -->
<nav style="background: #333; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
    <a href="/" style="color: white; margin-right: 20px; text-decoration: none; font-weight: 500;">Sleep Health Dashboard</a>
    <a href="/dashboard" style="color: white; margin-right: 20px; text-decoration: none;">Happiness Visualization</a>
    <a href="/sleep-data" style="color: white; text-decoration: none;">Sleep Data Table</a>
</nav>

<div class="table-container">
    <h2>Sleep Health & Lifestyle Dataset</h2>
    <table id="sleepTable">
        <thead>
        <tr>
            <th class="sortable" data-key="personId">ID <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="gender">Gender <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="age">Age <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="occupation">Occupation <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="sleepDuration">Sleep Duration <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="sleepQuality">Quality <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="physicalActivity">Activity Level <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="stressLevel">Stress Level <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="bmiCategory">BMI Category <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="bloodPressure">Blood Pressure <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="heartRate">Heart Rate <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="dailySteps">Daily Steps <span class="sort-arrow"></span></th>
            <th class="sortable" data-key="sleepDisorder">Sleep Disorder <span class="sort-arrow"></span></th>
        </tr>
        </thead>
        <tbody>
        <!-- Data will be injected here -->
        </tbody>
    </table>
    <div class="pagination">
        <div class="page-size">
            <label for="pageSize">Rows per page:</label>
            <select id="pageSize">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
        </div>
        <div class="controls">
            <button id="prevPage" disabled>Previous</button>
            <button id="nextPage" disabled>Next</button>
        </div>
        <div id="paginationSummary">Page 1 of 1</div>
    </div>
</div>

</body>
</html>
